<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tampilan judul website masih pengeditan untuk menampilkan yang lebih baik</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
    text-align: center;
    font-family: system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  }
  .gear {
    font-size: 4rem;
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: clamp(1.5rem, 5.5vw, 2.4rem);
    line-height: 1.35;
    max-width: 720px;
  }
  .bar {
    width: min(320px, 80vw);
    height: 10px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: #4fd1c5;
    border-radius: 999px;
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  p { opacity: .7; font-size: .95rem; }
</style>
</head>
<body>
  <div class="gear">⚙️</div>
  <h1>Tampilan judul website masih pengeditan untuk menampilkan yang lebih baik</h1>
 
</body>
</html>
